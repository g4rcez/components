name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        # src only, same scope as lib:types; tests/ has known type errors (follow-up)
        run: pnpm --filter @g4rcez/components exec tsc -p tsconfig.lib.json --noEmit
      - name: Test
        run: pnpm --filter @g4rcez/components test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib
        run: |
          start=$(date +%s)
          pnpm --filter @g4rcez/components build
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Size report
        working-directory: packages/lib/dist
        run: |
          size() { printf '%s\t%s\t%s\n' "$(wc -c < "$1")" "$(gzip -9c "$1" | wc -c)" "${1#./}"; }
          export -f size
          find . -name '*.mjs' ! -path './lint/*' -exec bash -c 'size "$0"' {} \; | sort -rn > /tmp/js.tsv
          find ./css -name '*.css' -exec bash -c 'size "$0"' {} \; | sort -rn > /tmp/css.tsv
          {
            echo "## Lib build"
            echo "Build time: ${BUILD_SECONDS}s"
            echo
            awk -F'\t' '{r+=$1; g+=$2; n++} END {printf "JS: %d files, %d bytes raw, %d bytes gzip\n\n", n, r, g}' /tmp/js.tsv
            awk -F'\t' '{r+=$1; g+=$2; n++} END {printf "CSS: %d files, %d bytes raw, %d bytes gzip\n\n", n, r, g}' /tmp/css.tsv
            echo "| raw | gzip | file |"
            echo "|---:|---:|---|"
            head -n 25 /tmp/js.tsv /tmp/css.tsv | grep -v '^==>' | grep . | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
