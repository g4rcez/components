name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pushes to main keep their own group so a newer merge never cancels a pending publish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        # src and tests/ (tsconfig.json); the build runs lib:types for src declarations
        run: pnpm --filter @g4rcez/components typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib
        run: |
          start=$(date +%s)
          pnpm --filter @g4rcez/components build
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Size report
        working-directory: packages/lib/dist
        run: |
          size() { printf '%s\t%s\t%s\n' "$(wc -c < "$1")" "$(gzip -9c "$1" | wc -c)" "${1#./}"; }
          export -f size
          find . -name '*.mjs' ! -path './lint/*' -exec bash -c 'size "$0"' {} \; | sort -rn > /tmp/js.tsv
          find ./css -name '*.css' -exec bash -c 'size "$0"' {} \; | sort -rn > /tmp/css.tsv
          {
            echo "## Lib build"
            echo "Build time: ${BUILD_SECONDS}s"
            echo
            awk -F'\t' '{r+=$1; g+=$2; n++} END {printf "JS: %d files, %d bytes raw, %d bytes gzip\n\n", n, r, g}' /tmp/js.tsv
            awk -F'\t' '{r+=$1; g+=$2; n++} END {printf "CSS: %d files, %d bytes raw, %d bytes gzip\n\n", n, r, g}' /tmp/css.tsv
            echo "| raw | gzip | file |"
            echo "|---:|---:|---|"
            head -n 25 /tmp/js.tsv /tmp/css.tsv | grep -v '^==>' | grep . | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test
        # after the build: css-sourcemaps, package-types and lint-publish read dist/
        run: pnpm --filter @g4rcez/components test

  publish:
    # Every commit on main (direct push or merged PR) publishes @g4rcez/components only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install --global npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - name: Resolve version
        id: version
        run: echo "value=$(node scripts/release-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Set version
        working-directory: packages/lib
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
      # prepublishOnly runs the lib build
      - name: Publish
        working-directory: packages/lib
        run: npm publish --access public --provenance
      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"
